[project]
name = "ghosttrace"
version = "0.1.0"
description = "Artifact-backed experiments on recursive transmission of behavioral traits."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jason Lovell" }]
dependencies = [
  "mlx>=0.18",
  "mlx-lm>=0.18",
  "aiohttp>=3.14.3",
  "anyio>=4.14.2",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pillow>=12.3.0",
  "tqdm>=4.66",
  "rich>=13.7",
  "typer>=0.12",
  "datasets>=5.0.1",
  "transformers>=5.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "pyright>=1.1.370"]

[project.scripts]
gt = "ghosttrace.cli:app"

[build-system]
requires = ["setuptools>=68", "build>=1.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ghosttrace*"]

[tool.ghosttrace]
seed = 1337

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: requires a real LLM / long-running"]

[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["ghosttrace", "tests"]
reportMissingTypeStubs = false
