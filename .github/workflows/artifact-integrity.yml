name: Artifact Integrity

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  artifact-integrity:
    name: Portable public-state checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify artifact manifest
        run: python scripts/build_artifact_manifest.py --check

      - name: Verify public evidence surface
        env:
          GHOSTTRACE_SKIP_SLOW: "1"
        run: python scripts/verify_public_state.py --skip-quality-gates

  source-safety:
    name: Source, safety, and package checks
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package and development tools
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Run complete local verification
        env:
          GHOSTTRACE_SKIP_SLOW: "1"
        run: python scripts/verify_public_state.py
